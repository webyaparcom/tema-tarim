<style>
  /* iletisim-sutunlar — Editoryal ve sade: ikon/kart yerine numara ve çizgi; mimarlık ve tasarım stüdyolarının yalın dili. */
  .modulex-iletisim-sutunlar { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }

  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-sutunlar :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */

  .modulex-iletisim-sutunlar :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-sutunlar img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-sutunlar) img { height: auto; }

  .modulex-iletisim-sutunlar-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }

  .modulex-iletisim-sutunlar-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-sutunlar-dugme:hover { transform: translateY(-2px); }

  .modulex-iletisim-sutunlar-sutunlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-block-start: 1px solid --cizgi--; }

  .modulex-iletisim-sutunlar-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }

  .modulex-iletisim-sutunlar-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-sutunlar-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-sutunlar-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-sutunlar-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-sutunlar-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-sutunlar-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-sutunlar-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-sutunlar-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-sutunlar-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-sutunlar :is(.modulex-iletisim-sutunlar-baslik, .modulex-iletisim-sutunlar-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-sutunlar-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {

</style>
