<header class="modulex-ust-kavis{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ust-kavis-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>

<style>
  /* ust-kavis — Düz çubuk yerine kavisli alt kenar: başlık sayfanın üstünde bir tente/kemer gibi durur (sıcak, davetkâr). */
  .modulex-ust-kavis { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-kavis *, .modulex-ust-kavis *::before, .modulex-ust-kavis *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-kavis :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-kavis :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-kavis :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-kavis :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-kavis img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-kavis) img { height: auto; }
  .modulex-ust-kavis [hidden] { display: none !important; }
  .modulex-ust-kavis :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-kavis :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-kavis-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-kavis-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-kavis--bassiz .modulex-ust-kavis-bas { display: none; }
  .modulex-ust-kavis-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-kavis-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-kavis-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-kavis-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-kavis-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-kavis-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-kavis-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-kavis-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-kavis-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-kavis { position: relative; z-index: 900; }
  .modulex-ust-kavis-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-kavis-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-kavis-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-kavis-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-kavis-oge:hover, .modulex-ust-kavis-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-kavis-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-kavis-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-kavis-cta .material-symbols-outlined, .modulex-ust-kavis-tel .material-symbols-outlined, .modulex-ust-kavis-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-kavis-tel, .modulex-ust-kavis-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-kavis-tel:hover, .modulex-ust-kavis-posta:hover { color: --accentInk--; }
  .modulex-ust-kavis-dil:empty { display: none; }
  .modulex-ust-kavis-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-kavis-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-kavis-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-kavis--acik .modulex-ust-kavis-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-kavis--acik .modulex-ust-kavis-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-kavis--acik .modulex-ust-kavis-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-kavis-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-kavis-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-kavis-sol 0.3s ease both; }
  @keyframes modulex-ust-kavis-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-kavis-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-kavis--js .modulex-ust-kavis-nav, .modulex-ust-kavis--js .modulex-ust-kavis-genis { display: none; }
    .modulex-ust-kavis--js .modulex-ust-kavis-ac { display: inline-flex; }
    .modulex-ust-kavis-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-kavis-in 0.3s ease both; }
    .modulex-ust-kavis-pliste { display: grid; }
    .modulex-ust-kavis-pliste .modulex-ust-kavis-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-kavis-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-kavis-panel { display: none !important; }
  }
  @keyframes modulex-ust-kavis-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-kavis-dal { position: relative; display: flex; flex-wrap: wrap; align-items: center; }
  .modulex-ust-kavis-dal-ac { display: inline-grid; place-items: center; width: 32px; height: 32px; margin-inline-start: 2px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: inherit; }
  .modulex-ust-kavis-dal-ac .material-symbols-outlined { font-size: 20px; transition: transform 0.2s ease; }
  .modulex-ust-kavis-dal--acik > .modulex-ust-kavis-dal-ac .material-symbols-outlined { transform: rotate(180deg); }
  .modulex-ust-kavis-dal--aktif > .modulex-ust-kavis-oge { color: --accentInk--; }
  .modulex-ust-kavis-altliste { position: absolute; inset-block-start: 100%; inset-inline-start: 0; z-index: 5; display: none; gap: 2px; min-width: 230px; padding: 8px; border: 1px solid --cizgi--; border-radius: 14px; background: --bg--; color: --text--; box-shadow: 0 22px 44px -26px color-mix(in srgb, --text-- 55%, transparent); text-align: start; }
  .modulex-ust-kavis-dal:hover > .modulex-ust-kavis-altliste, .modulex-ust-kavis-dal:focus-within > .modulex-ust-kavis-altliste, .modulex-ust-kavis-dal--acik > .modulex-ust-kavis-altliste { display: grid; }
  .modulex-ust-kavis-aoge { display: flex; align-items: center; min-height: 42px; padding: 6px 12px; border-radius: 9px; color: inherit; font-weight: 600; text-decoration: none; white-space: nowrap; text-transform: none; letter-spacing: 0; }
  .modulex-ust-kavis-aoge:hover, .modulex-ust-kavis-aoge[aria-current="page"] { background: color-mix(in srgb, --accent-- 12%, --bg--); color: --accentInk--; }
  .modulex-ust-kavis-panel .modulex-ust-kavis-altliste, .modulex-ust-kavis-pliste .modulex-ust-kavis-altliste { position: static; display: grid; width: 100%; min-width: 0; padding: 0 0 10px; padding-inline-start: 18px; border: 0; border-radius: 0; background: transparent; color: inherit; box-shadow: none; }
  .modulex-ust-kavis-panel .modulex-ust-kavis-dal-ac, .modulex-ust-kavis-pliste .modulex-ust-kavis-dal-ac { display: none; }
  .modulex-ust-kavis-panel .modulex-ust-kavis-aoge { min-height: 40px; color: inherit; font-size: 0.95rem; white-space: normal; }
  @media (max-width: 1024px) {
    .modulex-ust-kavis:not(.modulex-ust-kavis--js) .modulex-ust-kavis-altliste { position: static; display: grid; box-shadow: none; }
  }

  /* vurgu zeminde dil çubuğu etkin çipi «currentColor %16» zemini açar (3.9:1) → ters çip */
  .modulex-ust-kavis { --wm-lang-active-bg: --vurguBg--; --wm-lang-active-color: --vurguText--; }
  .modulex-ust-kavis.modulex-ust-kavis { padding-block-end: 22px; border-end-start-radius: 50% 34px; border-end-end-radius: 50% 34px; }
  .modulex-ust-kavis-cubuk { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px 20px; padding-block-start: 16px; }
  .modulex-ust-kavis-sol, .modulex-ust-kavis-sag { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-kavis-sag { justify-content: flex-end; }
  .modulex-ust-kavis-cubuk > .modulex-ust-kavis-logo { justify-self: center; }
  .modulex-ust-kavis-nav { grid-column: 1 / -1; display: flex; justify-content: center; }
  .modulex-ust-kavis-liste { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 28px; }
  .modulex-ust-kavis-liste > li > .modulex-ust-kavis-oge::after { content: ""; position: absolute; inset-inline: 30%; inset-block-end: 6px; height: 2px; border-radius: 2px; background: currentColor; opacity: 0; transition: inset-inline 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-kavis-liste > li > .modulex-ust-kavis-oge:hover::after, .modulex-ust-kavis-liste > li > .modulex-ust-kavis-oge[aria-current="page"]::after { inset-inline: 0; opacity: 1; }
  .modulex-ust-kavis-liste > li > .modulex-ust-kavis-oge:hover, .modulex-ust-kavis-liste > li > .modulex-ust-kavis-oge[aria-current="page"] { color: --text--; }
  @media (max-width: 1024px) {
    .modulex-ust-kavis.modulex-ust-kavis { padding-block-end: 16px; }
    .modulex-ust-kavis--js .modulex-ust-kavis-cubuk { grid-template-columns: minmax(0, 1fr) auto; }
    .modulex-ust-kavis--js .modulex-ust-kavis-cubuk > .modulex-ust-kavis-logo { justify-self: start; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kavis :is(.modulex-ust-kavis-baslik, .modulex-ust-kavis-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kavis-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-kavis { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-kavis *, .modulex-ust-kavis *::before, .modulex-ust-kavis *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-kavis";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    const altmenu = (s, P) => {
          const dallar = [...s.querySelectorAll("." + P + "-dal")];
          if (!dallar.length) return;
          const kapa = (d, odak) => {
            const b = d.querySelector(":scope > ." + P + "-dal-ac");
            if (!d.classList.contains(P + "-dal--acik")) return;
            d.classList.remove(P + "-dal--acik");
            b.setAttribute("aria-expanded", "false");
            if (odak) b.focus();
          };
          dallar.forEach((d) => {
            const b = d.querySelector(":scope > ." + P + "-dal-ac");
            if (!b) return;
            b.addEventListener("click", () => {
              const acik = d.classList.contains(P + "-dal--acik");
              dallar.forEach((x) => kapa(x, false));
              if (!acik) { d.classList.add(P + "-dal--acik"); b.setAttribute("aria-expanded", "true"); }
            });
            d.addEventListener("keydown", (e) => { if (e.key === "Escape") kapa(d, true); });
          });
          document.addEventListener("click", (e) => { dallar.forEach((d) => { if (!d.contains(e.target)) kapa(d, false); }); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
      altmenu(s, P, az);
    });
  })();
</script>
